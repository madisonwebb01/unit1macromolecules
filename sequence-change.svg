<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 325" width="100%" role="img" aria-label="Changing one amino acid in the sequence"><title>Changing one amino acid in the sequence</title><rect width="700" height="325" fill="#ffffff"/><text x="30" y="26" font-family="'Titillium Web',-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="700" fill="#0d2233">ONE AMINO ACID IS SWAPPED IN THE SEQUENCE</text><line x1="55" y1="82" x2="117" y2="82" stroke="#1D4C7A" stroke-width="2.5"/><line x1="117" y1="82" x2="179" y2="82" stroke="#1D4C7A" stroke-width="2.5"/><line x1="179" y1="82" x2="241" y2="82" stroke="#1D4C7A" stroke-width="2.5"/><line x1="241" y1="82" x2="303" y2="82" stroke="#1D4C7A" stroke-width="2.5"/><line x1="303" y1="82" x2="365" y2="82" stroke="#1D4C7A" stroke-width="2.5"/><line x1="365" y1="82" x2="427" y2="82" stroke="#1D4C7A" stroke-width="2.5"/><line x1="427" y1="82" x2="489" y2="82" stroke="#1D4C7A" stroke-width="2.5"/><line x1="489" y1="82" x2="551" y2="82" stroke="#1D4C7A" stroke-width="2.5"/><circle cx="55" cy="82" r="15" fill="#2DA8C8" stroke="#1D4C7A" stroke-width="2"/><circle cx="117" cy="82" r="15" fill="#2DA8C8" stroke="#1D4C7A" stroke-width="2"/><circle cx="179" cy="82" r="15" fill="#2DA8C8" stroke="#1D4C7A" stroke-width="2"/><circle cx="241" cy="82" r="15" fill="#2DA8C8" stroke="#1D4C7A" stroke-width="2"/><circle cx="303" cy="82" r="15" fill="#C2622A" stroke="#1D4C7A" stroke-width="2"/><circle cx="365" cy="82" r="15" fill="#2DA8C8" stroke="#1D4C7A" stroke-width="2"/><circle cx="427" cy="82" r="15" fill="#2DA8C8" stroke="#1D4C7A" stroke-width="2"/><circle cx="489" cy="82" r="15" fill="#2DA8C8" stroke="#1D4C7A" stroke-width="2"/><circle cx="551" cy="82" r="15" fill="#2DA8C8" stroke="#1D4C7A" stroke-width="2"/><line x1="303" y1="102" x2="303" y2="116" stroke="#C2622A" stroke-width="2.5"/><text x="303" y="132" font-family="'Titillium Web',-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700" fill="#C2622A" t